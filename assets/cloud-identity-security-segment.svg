<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="390" viewBox="0 0 1500 390" role="img" aria-labelledby="title desc"><title id="title">Cloud Identity and Attack Path Security</title><desc id="desc">Visual workflow from identity exposure to graph analysis, attack paths, and recovery.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071b17"/><stop offset="1" stop-color="#111827"/></linearGradient><style>.t{font-family:Inter,Arial,sans-serif;fill:#f8fafc}.m{fill:#9fc2b7}.b{fill:#0d211d;stroke:#047857;stroke-width:1.5}.chip{fill:#113128;stroke:#065f46;stroke-width:1}</style></defs><rect width="1500" height="390" rx="28" fill="url(#bg)"/><text x="60" y="62" class="t" font-size="32" font-weight="800">Cloud · Identity · SaaS · Attack Paths</text><text x="60" y="96" class="t m" font-size="17">exposure → graph → attack path → recovery</text><g transform="translate(60 135)"><g><rect class="b" width="300" height="175" rx="18"/><text x="24" y="38" class="t" font-size="19" font-weight="700">1 · Map exposure</text><rect class="chip" x="22" y="66" width="108" height="34" rx="17"/><text x="76" y="88" class="t" text-anchor="middle" font-size="13">SaaSGraph</text><rect class="chip" x="140" y="66" width="120" height="34" rx="17"/><text x="200" y="88" class="t" text-anchor="middle" font-size="13">AgentAtlas</text><text x="24" y="132" class="t m" font-size="14">OAuth · token behavior</text><text x="24" y="155" class="t m" font-size="14">permissions · effective access</text></g><g transform="translate(340 0)"><rect class="b" width="300" height="175" rx="18"/><text x="24" y="38" class="t" font-size="19" font-weight="700">2 · Build graph context</text><rect class="chip" x="22" y="66" width="122" height="34" rx="17"/><text x="83" y="88" class="t" text-anchor="middle" font-size="13">AttackPath AI</text><rect class="chip" x="154" y="66" width="126" height="34" rx="17"/><text x="217" y="88" class="t" text-anchor="middle" font-size="13">GPU Trust</text><text x="24" y="132" class="t m" font-size="14">identity · workload · trust edges</text><text x="24" y="155" class="t m" font-size="14">blast radius · reachability</text></g><g transform="translate(680 0)"><rect class="b" width="350" height="175" rx="18"/><text x="24" y="38" class="t" font-size="19" font-weight="700">3 · Test interventions</text><rect class="chip" x="22" y="66" width="190" height="34" rx="17"/><text x="117" y="88" class="t" text-anchor="middle" font-size="13">Counterfactual Security Engine</text><rect class="chip" x="22" y="108" width="190" height="34" rx="17"/><text x="117" y="130" class="t" text-anchor="middle" font-size="13">AI Data Center Digital Twin</text></g><g transform="translate(1070 0)"><rect class="b" width="310" height="175" rx="18"/><text x="24" y="38" class="t" font-size="19" font-weight="700">4 · Recover safely</text><rect class="chip" x="22" y="66" width="120" height="34" rx="17"/><text x="82" y="88" class="t" text-anchor="middle" font-size="13">CloudRescue</text><text x="24" y="132" class="t m" font-size="14">recoverability gates</text><text x="24" y="155" class="t m" font-size="14">restore forecasting · assurance</text></g></g><g fill="#10b981"><path d="M370 217h20l-10-8v16z"/><path d="M710 217h20l-10-8v16z"/><path d="M1040 217h20l-10-8v16z"/></g></svg>