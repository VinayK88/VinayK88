<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="680" viewBox="0 0 1500 680" role="img" aria-labelledby="title desc">
  <title id="title">Vinay K. portfolio ecosystem</title>
  <desc id="desc">Visual map organizing the public GitHub portfolio into security and AI systems, research labs, curated collections, and assessment archives.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08111f"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <style>.t{font-family:Inter,Arial,sans-serif;fill:#f8fafc}.m{fill:#94a3b8}.card{fill:#121c2e;stroke:#334155;stroke-width:1.5}</style>
  </defs>
  <rect width="1500" height="680" rx="30" fill="url(#bg)"/>
  <text x="70" y="78" class="t" font-size="38" font-weight="800">Portfolio Ecosystem</text>
  <text x="70" y="116" class="t m" font-size="18">36 project repositories · organized by purpose instead of presented as one undifferentiated list</text>

  <g transform="translate(70 174)">
    <g><rect class="card" width="640" height="188" rx="22"/><rect x="24" y="24" width="98" height="34" rx="17" fill="#0f766e"/><text x="73" y="47" class="t" text-anchor="middle" font-size="14" font-weight="700">24 REPOS</text><text x="24" y="92" class="t" font-size="24" font-weight="800">Security + AI Systems</text><text x="24" y="126" class="t m" font-size="16">Agent security · detection ML · trust &amp; safety · CTI · cloud · SaaS</text><text x="24" y="154" class="t m" font-size="16">attack paths · recovery · supply chain · infrastructure · web abuse</text></g>
    <g transform="translate(700 0)"><rect class="card" width="640" height="188" rx="22"/><rect x="24" y="24" width="90" height="34" rx="17" fill="#7c3aed"/><text x="69" y="47" class="t" text-anchor="middle" font-size="14" font-weight="700">5 REPOS</text><text x="24" y="92" class="t" font-size="24" font-weight="800">AI Research + Systems Labs</text><text x="24" y="126" class="t m" font-size="16">Agent evals · containment · oversight · interpretability</text><text x="24" y="154" class="t m" font-size="16">inference scheduling · reproducible experimental design</text></g>
  </g>

  <g transform="translate(70 398)">
    <g><rect class="card" width="640" height="188" rx="22"/><rect x="24" y="24" width="90" height="34" rx="17" fill="#2563eb"/><text x="69" y="47" class="t" text-anchor="middle" font-size="14" font-weight="700">5 REPOS</text><text x="24" y="92" class="t" font-size="24" font-weight="800">Curated Analytics Collections</text><text x="24" y="126" class="t m" font-size="16">Cybersecurity notebooks · classical data science · NLP</text><text x="24" y="154" class="t m" font-size="16">customer analytics · social-media / applied ML archives</text></g>
    <g transform="translate(700 0)"><rect class="card" width="640" height="188" rx="22"/><rect x="24" y="24" width="90" height="34" rx="17" fill="#d97706"/><text x="69" y="47" class="t" text-anchor="middle" font-size="14" font-weight="700">2 REPOS</text><text x="24" y="92" class="t" font-size="24" font-weight="800">Assessment Archives</text><text x="24" y="126" class="t m" font-size="16">Python proficiency evidence · historical EA take-home</text><text x="24" y="154" class="t m" font-size="16">kept clearly separate from current production-style projects</text></g>
  </g>
  <text x="750" y="636" class="t m" text-anchor="middle" font-size="15">Flagships lead with outcomes and evaluation; archives preserve breadth without overstating current production maturity.</text>
</svg>