<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="680" viewBox="0 0 1500 680" role="img" aria-labelledby="title desc">
  <title id="title">Vinay K. cybersecurity-first portfolio ecosystem</title>
  <desc id="desc">Visual map placing all cybersecurity and AI-security repositories first, followed by AI systems research and older analytics archives.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08111f"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <style>.t{font-family:Inter,Arial,sans-serif;fill:#f8fafc}.m{fill:#94a3b8}.card{fill:#121c2e;stroke:#334155;stroke-width:1.5}</style>
  </defs>
  <rect width="1500" height="680" rx="30" fill="url(#bg)"/>
  <text x="70" y="78" class="t" font-size="38" font-weight="800">Cybersecurity-First Portfolio</text>
  <text x="70" y="116" class="t m" font-size="18">36 project repositories · security and AI-security work leads · older analytics stays in the archive layer</text>

  <g transform="translate(70 174)">
    <g><rect class="card" width="1340" height="188" rx="22"/><rect x="24" y="24" width="104" height="34" rx="17" fill="#0f766e"/><text x="76" y="47" class="t" text-anchor="middle" font-size="14" font-weight="700">28 REPOS</text><text x="24" y="92" class="t" font-size="26" font-weight="800">Cybersecurity + AI Security</text><text x="24" y="126" class="t m" font-size="16">Agent security · detection engineering · threat intelligence · identity · cloud/SaaS · web abuse · Trust &amp; Safety</text><text x="24" y="154" class="t m" font-size="16">attack paths · recovery · supply chain · infrastructure · LLM safeguards · containment · oversight · security analytics</text></g>
  </g>

  <g transform="translate(70 398)">
    <g><rect class="card" width="410" height="188" rx="22"/><rect x="24" y="24" width="90" height="34" rx="17" fill="#7c3aed"/><text x="69" y="47" class="t" text-anchor="middle" font-size="14" font-weight="700">2 REPOS</text><text x="24" y="92" class="t" font-size="22" font-weight="800">AI Systems Research</text><text x="24" y="126" class="t m" font-size="15">Interpretability · inference scheduling</text><text x="24" y="154" class="t m" font-size="15">kept after the security portfolio</text></g>
    <g transform="translate(465 0)"><rect class="card" width="410" height="188" rx="22"/><rect x="24" y="24" width="90" height="34" rx="17" fill="#2563eb"/><text x="69" y="47" class="t" text-anchor="middle" font-size="14" font-weight="700">4 REPOS</text><text x="24" y="92" class="t" font-size="22" font-weight="800">Older Analytics Archives</text><text x="24" y="126" class="t m" font-size="15">Data science · NLP · customer analytics</text><text x="24" y="154" class="t m" font-size="15">social-media / applied ML history</text></g>
    <g transform="translate(930 0)"><rect class="card" width="410" height="188" rx="22"/><rect x="24" y="24" width="90" height="34" rx="17" fill="#d97706"/><text x="69" y="47" class="t" text-anchor="middle" font-size="14" font-weight="700">2 REPOS</text><text x="24" y="92" class="t" font-size="22" font-weight="800">Assessment Archives</text><text x="24" y="126" class="t m" font-size="15">Python proficiency · historical take-home</text><text x="24" y="154" class="t m" font-size="15">supporting evidence only</text></g>
  </g>
  <text x="750" y="636" class="t m" text-anchor="middle" font-size="15">Reviewers see current cybersecurity depth first; historical breadth remains available without competing with the core story.</text>
</svg>