<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="390" viewBox="0 0 1500 390" role="img" aria-labelledby="title desc"><title id="title">Detection Engineering and Web Security</title><desc id="desc">Visual workflow from telemetry to detection, investigation, and tuning.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#111827"/></linearGradient><style>.t{font-family:Inter,Arial,sans-serif;fill:#f8fafc}.m{fill:#9fb7c7}.b{fill:#0e1d2b;stroke:#0369a1;stroke-width:1.5}.chip{fill:#10283a;stroke:#075985;stroke-width:1}</style></defs><rect width="1500" height="390" rx="28" fill="url(#bg)"/><text x="60" y="62" class="t" font-size="32" font-weight="800">Detection Engineering · Web · Endpoint</text><text x="60" y="96" class="t m" font-size="17">telemetry → detect → investigate → tune</text><g transform="translate(60 135)"><g><rect class="b" width="300" height="175" rx="18"/><text x="24" y="38" class="t" font-size="19" font-weight="700">1 · Build telemetry</text><rect class="chip" x="22" y="66" width="170" height="34" rx="17"/><text x="107" y="88" class="t" text-anchor="middle" font-size="13">Security Telemetry Lakehouse</text><rect class="chip" x="22" y="108" width="165" height="34" rx="17"/><text x="104" y="130" class="t" text-anchor="middle" font-size="13">Cybersecurity Analytics</text></g><g transform="translate(340 0)"><rect class="b" width="300" height="175" rx="18"/><text x="24" y="38" class="t" font-size="19" font-weight="700">2 · Detect attacks</text><rect class="chip" x="22" y="66" width="126" height="34" rx="17"/><text x="85" y="88" class="t" text-anchor="middle" font-size="13">DetectionForge</text><rect class="chip" x="158" y="66" width="112" height="34" rx="17"/><text x="214" y="88" class="t" text-anchor="middle" font-size="13">BrowserGuard</text><rect class="chip" x="22" y="108" width="122" height="34" rx="17"/><text x="83" y="130" class="t" text-anchor="middle" font-size="13">MacSentinel</text></g><g transform="translate(680 0)"><rect class="b" width="340" height="175" rx="18"/><text x="24" y="38" class="t" font-size="19" font-weight="700">3 · Investigate gaps</text><rect class="chip" x="22" y="66" width="140" height="34" rx="17"/><text x="92" y="88" class="t" text-anchor="middle" font-size="13">AdversarialWeb</text><text x="24" y="132" class="t m" font-size="14">false positives · false negatives</text><text x="24" y="155" class="t m" font-size="14">campaigns · bot / ATO patterns</text></g><g transform="translate(1060 0)"><rect class="b" width="320" height="175" rx="18"/><text x="24" y="38" class="t" font-size="19" font-weight="700">4 · Tune safely</text><text x="24" y="78" class="t m" font-size="14">replay · threshold guardrails</text><text x="24" y="104" class="t m" font-size="14">feature improvement · release gates</text><text x="24" y="130" class="t m" font-size="14">robustness · analyst feedback</text></g></g><g fill="#0ea5e9"><path d="M370 217h20l-10-8v16z"/><path d="M710 217h20l-10-8v16z"/><path d="M1030 217h20l-10-8v16z"/></g></svg>