<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620" role="img" aria-labelledby="title desc">
<title id="title">Cybersecurity and AI Security Portfolio Map</title><desc id="desc">Four-domain map of agent security, detection engineering, cloud and identity security, and threat intelligence and risk.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#111827"/></linearGradient><style>.t{font-family:Inter,Arial,sans-serif;fill:#f8fafc}.m{fill:#94a3b8}.c{fill:#111c2d;stroke:#334155;stroke-width:1.5}</style></defs>
<rect width="1500" height="620" rx="30" fill="url(#bg)"/>
<text x="70" y="72" class="t" font-size="36" font-weight="800">Cybersecurity &amp; AI Security Portfolio</text><text x="70" y="108" class="t m" font-size="18">28 projects organized around four security operating domains</text>
<g transform="translate(70 150)">
<g><rect class="c" width="640" height="175" rx="22"/><rect x="24" y="22" width="150" height="30" rx="15" fill="#6d28d9"/><text x="99" y="43" class="t" text-anchor="middle" font-size="13" font-weight="700">AGENT + LLM SECURITY</text><text x="24" y="88" class="t" font-size="24" font-weight="800">Govern AI agents safely</text><text x="24" y="121" class="t m" font-size="16">runtime policy · agent posture · LLM evals · containment</text><text x="24" y="148" class="t m" font-size="16">human approval · remediation · oversight integrity</text></g>
<g transform="translate(700 0)"><rect class="c" width="640" height="175" rx="22"/><rect x="24" y="22" width="160" height="30" rx="15" fill="#0369a1"/><text x="104" y="43" class="t" text-anchor="middle" font-size="13" font-weight="700">DETECTION ENGINEERING</text><text x="24" y="88" class="t" font-size="24" font-weight="800">Find attacks, explain misses</text><text x="24" y="121" class="t m" font-size="16">telemetry · detection-as-code · web abuse · endpoint ML</text><text x="24" y="148" class="t m" font-size="16">FP/FN analysis · replay · threshold tuning · robustness</text></g>
</g>
<g transform="translate(70 357)">
<g><rect class="c" width="640" height="175" rx="22"/><rect x="24" y="22" width="165" height="30" rx="15" fill="#047857"/><text x="106" y="43" class="t" text-anchor="middle" font-size="13" font-weight="700">CLOUD + IDENTITY</text><text x="24" y="88" class="t" font-size="24" font-weight="800">Map exposure and blast radius</text><text x="24" y="121" class="t m" font-size="16">OAuth/SaaS · identities · attack paths · cloud recovery</text><text x="24" y="148" class="t m" font-size="16">GPU trust · cyber-physical infrastructure · counterfactuals</text></g>
<g transform="translate(700 0)"><rect class="c" width="640" height="175" rx="22"/><rect x="24" y="22" width="205" height="30" rx="15" fill="#b45309"/><text x="126" y="43" class="t" text-anchor="middle" font-size="13" font-weight="700">THREAT INTEL + RISK</text><text x="24" y="88" class="t" font-size="24" font-weight="800">Turn evidence into decisions</text><text x="24" y="121" class="t m" font-size="16">CTI graphs · OSINT · provenance · supply-chain risk</text><text x="24" y="148" class="t m" font-size="16">fraud / abuse ML · Trust &amp; Safety · cost-aware policy</text></g>
</g>
<text x="750" y="580" class="t m" text-anchor="middle" font-size="15">observe → detect → reason → govern → verify</text>
</svg>