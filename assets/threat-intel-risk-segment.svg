<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="390" viewBox="0 0 1500 390" role="img" aria-labelledby="title desc"><title id="title">Threat Intelligence Supply Chain and Risk</title><desc id="desc">Visual workflow from collection and correlation to decisioning and enforcement.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#241506"/><stop offset="1" stop-color="#111827"/></linearGradient><style>.t{font-family:Inter,Arial,sans-serif;fill:#f8fafc}.m{fill:#c7ad94}.b{fill:#24180d;stroke:#b45309;stroke-width:1.5}.chip{fill:#33210f;stroke:#92400e;stroke-width:1}</style></defs><rect width="1500" height="390" rx="28" fill="url(#bg)"/><text x="60" y="62" class="t" font-size="32" font-weight="800">Threat Intelligence · Supply Chain · Trust &amp; Safety</text><text x="60" y="96" class="t m" font-size="17">collect → correlate → decide → enforce</text><g transform="translate(60 135)"><g><rect class="b" width="310" height="175" rx="18"/><text x="24" y="38" class="t" font-size="19" font-weight="700">1 · Collect evidence</text><rect class="chip" x="22" y="66" width="156" height="34" rx="17"/><text x="100" y="88" class="t" text-anchor="middle" font-size="13">OSINT Threat Intel Agent</text><rect class="chip" x="22" y="108" width="110" height="34" rx="17"/><text x="77" y="130" class="t" text-anchor="middle" font-size="13">DeepTrace</text></g><g transform="translate(350 0)"><rect class="b" width="330" height="175" rx="18"/><text x="24" y="38" class="t" font-size="19" font-weight="700">2 · Correlate context</text><rect class="chip" x="22" y="66" width="190" height="34" rx="17"/><text x="117" y="88" class="t" text-anchor="middle" font-size="13">Threat Intelligence Knowledge Graph</text><rect class="chip" x="22" y="108" width="170" height="34" rx="17"/><text x="107" y="130" class="t" text-anchor="middle" font-size="13">SupplyChain Guardian AI</text></g><g transform="translate(720 0)"><rect class="b" width="300" height="175" rx="18"/><text x="24" y="38" class="t" font-size="19" font-weight="700">3 · Quantify risk</text><rect class="chip" x="22" y="66" width="112" height="34" rx="17"/><text x="78" y="88" class="t" text-anchor="middle" font-size="13">SignalForge</text><rect class="chip" x="144" y="66" width="96" height="34" rx="17"/><text x="192" y="88" class="t" text-anchor="middle" font-size="13">RiskOS</text><text x="24" y="132" class="t m" font-size="14">graph risk · calibration</text><text x="24" y="155" class="t m" font-size="14">expected loss · review capacity</text></g><g transform="translate(1060 0)"><rect class="b" width="320" height="175" rx="18"/><text x="24" y="38" class="t" font-size="19" font-weight="700">4 · Act with guardrails</text><text x="24" y="78" class="t m" font-size="14">analyst review · release gates</text><text x="24" y="104" class="t m" font-size="14">policy outcomes · human approval</text><text x="24" y="130" class="t m" font-size="14">provenance · evidence-backed action</text></g></g><g fill="#f59e0b"><path d="M380 217h20l-10-8v16z"/><path d="M690 217h20l-10-8v16z"/><path d="M1030 217h20l-10-8v16z"/></g></svg>