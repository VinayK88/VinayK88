<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="390" viewBox="0 0 1500 390" role="img" aria-labelledby="title desc"><title id="title">Agent and LLM Security</title><desc id="desc">Visual workflow linking agent inventory, runtime governance, evaluation, and remediation projects.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#120b24"/><stop offset="1" stop-color="#111827"/></linearGradient><style>.t{font-family:Inter,Arial,sans-serif;fill:#f8fafc}.m{fill:#a7a3c2}.b{fill:#171429;stroke:#6d28d9;stroke-width:1.5}.chip{fill:#201a37;stroke:#4c1d95;stroke-width:1}</style></defs><rect width="1500" height="390" rx="28" fill="url(#bg)"/><text x="60" y="62" class="t" font-size="32" font-weight="800">Agent &amp; LLM Security</text><text x="60" y="96" class="t m" font-size="17">inventory → govern → evaluate → remediate</text><g transform="translate(60 135)"><g><rect class="b" width="300" height="175" rx="18"/><text x="24" y="38" class="t" font-size="19" font-weight="700">1 · Discover &amp; understand</text><rect class="chip" x="22" y="66" width="120" height="34" rx="17"/><text x="82" y="88" class="t" text-anchor="middle" font-size="13">AgentAtlas</text><rect class="chip" x="152" y="66" width="126" height="34" rx="17"/><text x="215" y="88" class="t" text-anchor="middle" font-size="13">Agentic SOC</text><text x="24" y="132" class="t m" font-size="14">posture · effective access</text><text x="24" y="155" class="t m" font-size="14">evidence-grounded investigations</text></g><g transform="translate(340 0)"><rect class="b" width="300" height="175" rx="18"/><text x="24" y="38" class="t" font-size="19" font-weight="700">2 · Govern runtime</text><rect class="chip" x="22" y="66" width="118" height="34" rx="17"/><text x="81" y="88" class="t" text-anchor="middle" font-size="13">AgentShield</text><rect class="chip" x="150" y="66" width="108" height="34" rx="17"/><text x="204" y="88" class="t" text-anchor="middle" font-size="13">AegisMesh</text><text x="24" y="132" class="t m" font-size="14">tool policy · least privilege</text><text x="24" y="155" class="t m" font-size="14">approval gates · orchestration</text></g><g transform="translate(680 0)"><rect class="b" width="360" height="175" rx="18"/><text x="24" y="38" class="t" font-size="19" font-weight="700">3 · Evaluate safeguards</text><rect class="chip" x="22" y="66" width="150" height="34" rx="17"/><text x="97" y="88" class="t" text-anchor="middle" font-size="13">LLM Security Eval</text><rect class="chip" x="182" y="66" width="150" height="34" rx="17"/><text x="257" y="88" class="t" text-anchor="middle" font-size="13">Frontier Agent Evals</text><rect class="chip" x="22" y="108" width="150" height="34" rx="17"/><text x="97" y="130" class="t" text-anchor="middle" font-size="13">Containment Eval</text><rect class="chip" x="182" y="108" width="150" height="34" rx="17"/><text x="257" y="130" class="t" text-anchor="middle" font-size="13">Oversight Integrity</text></g><g transform="translate(1080 0)"><rect class="b" width="300" height="175" rx="18"/><text x="24" y="38" class="t" font-size="19" font-weight="700">4 · Fix &amp; assure</text><rect class="chip" x="22" y="66" width="116" height="34" rx="17"/><text x="80" y="88" class="t" text-anchor="middle" font-size="13">VulnSignal</text><rect class="chip" x="148" y="66" width="118" height="34" rx="17"/><text x="207" y="88" class="t" text-anchor="middle" font-size="13">InfraGuard AI</text><text x="24" y="132" class="t m" font-size="14">finding quality · remediation</text><text x="24" y="155" class="t m" font-size="14">safety envelopes · assurance</text></g></g><g fill="#8b5cf6"><path d="M370 217h20l-10-8v16z"/><path d="M710 217h20l-10-8v16z"/><path d="M1070 217h20l-10-8v16z"/></g></svg>